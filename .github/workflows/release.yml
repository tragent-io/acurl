name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]   # not the moving v1 tag used by the Action

permissions:
  contents: write    # GitHub release
  packages: write    # ghcr.io images
  id-token: write    # keyless cosign signing

jobs:
  # Tag pushes do not re-run CI. Gate publishing on the CI workflow that
  # already ran (or is still running) for the tagged commit.
  ensure-ci:
    name: Ensure CI passed
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for CI on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          echo "Requiring a successful CI workflow run on ${sha} before releasing"

          # CI includes a multi-OS matrix plus headless Chrome; allow up to 45m.
          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            json="$(gh run list --workflow=ci.yml --commit="${sha}" --limit=20 \
              --json databaseId,status,conclusion,url,event)"

            if [[ "$(jq 'length' <<<"${json}")" -eq 0 ]]; then
              echo "No CI run found yet for ${sha}; retrying..."
              sleep 20
              continue
            fi

            # Newest first from gh. Prefer watching an in-progress run.
            pending="$(jq -r '[.[] | select(.status != "completed")][0] // empty | "\(.databaseId)\t\(.url)"' <<<"${json}")"
            if [[ -n "${pending}" ]]; then
              id="${pending%%$'\t'*}"
              url="${pending#*$'\t'}"
              echo "CI run ${id} still in progress: ${url}"
              if gh run watch "${id}" --exit-status; then
                echo "CI passed on ${sha}"
                exit 0
              fi
              echo "::error::CI failed on ${sha}. Refusing to publish this release. See ${url}"
              exit 1
            fi

            newest="$(jq -r '.[0] | "\(.databaseId)\t\(.conclusion)\t\(.url)"' <<<"${json}")"
            id="$(cut -f1 <<<"${newest}")"
            conclusion="$(cut -f2 <<<"${newest}")"
            url="$(cut -f3 <<<"${newest}")"
            if [[ "${conclusion}" == "success" ]]; then
              echo "CI run ${id} succeeded on ${sha}"
              exit 0
            fi
            echo "::error::CI on ${sha} concluded '${conclusion}' (run ${id}). Refusing to publish this release. See ${url}"
            exit 1
          done

          echo "::error::Timed out after 45m waiting for CI on ${sha}. Refusing to publish this release."
          exit 1

  release:
    needs: ensure-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Move v1 tag
        if: ${{ startsWith(github.ref_name, 'v1.') && !contains(github.ref_name, '-') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a v1 -m "acurl v1 (${GITHUB_REF_NAME})" "${GITHUB_REF_NAME}^{}"
          git push -f origin v1

  npm:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @tragent/acurl
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set, skipping"; exit 0; fi
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}" --allow-same-version
          npm publish --access public --provenance
